
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой арабский словарь</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #eaf5f7;
    font-family: Arial, sans-serif;
  }
  .cards { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 24px; }
  .card {
    width: 310px;
    padding: 30px 20px;
    border: 3px solid #e4c06d;
    border-radius: 25px;
    background: white;
    box-shadow: 0 12px 30px #0002;
    cursor: pointer;
    text-align: center;
  }
  .card:hover {
    transform: scale(1.03);
  }
  .earth {
    width: 230px;
    height: 230px;
  }
  .arabic {
    font-family: "Traditional Arabic", "Times New Roman", serif;
    font-size: 65px;
    color: #184e77;
    margin: 15px 0;
    direction: rtl;
  }
  .hint {
    color: #526b7a;
    font-size: 17px;
  }

  .word-family-card { cursor: default; }
  .word-family-card:hover { transform: none; }
  .word-family-card .earth { width: 210px; height: 210px; }
  .word-form {
    display: block; width: 100%; box-sizing: border-box;
    padding: 10px 12px; margin: 9px 0;
    border: 1.5px solid #acd0e3; border-radius: 14px;
    background: #f2faff; cursor: pointer; text-align: center;
    font-family: Arial, sans-serif;
  }
  .word-form:hover { background: #e1f3ff; }
  .word-form:focus-visible { outline: 3px solid #2e7cab; outline-offset: 2px; }
  .word-form .arabic { font-size: 40px; margin: 0 0 3px; }
  .word-form .meaning { font-size: 13px; color: #526b7a; }
</style>
</head>

<script>
function speakArabic(word) {
  if (!("speechSynthesis" in window)) {
    alert("Браузер не поддерживает озвучивание.");
    return;
  }

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(word);
  speech.lang = "ar-SA";
  speech.rate = 0.8;

  const voices = window.speechSynthesis.getVoices();
  const arabicVoice = voices.find(
    voice => voice.lang.toLowerCase().startsWith("ar")
  );

  if (arabicVoice) {
    speech.voice = arabicVoice;
  }

  window.speechSynthesis.speak(speech);
}
</script>
