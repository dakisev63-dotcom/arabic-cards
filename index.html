
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой арабский словарь</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #eaf5f7;
    font-family: Arial, sans-serif;
  }
  .cards { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 24px; }
  .card {
    width: 310px;
    padding: 30px 20px;
    border: 3px solid #e4c06d;
    border-radius: 25px;
    background: white;
    box-shadow: 0 12px 30px #0002;
    cursor: pointer;
    text-align: center;
  }
  .card:hover {
    transform: scale(1.03);
  }
  .earth {
    width: 230px;
    height: 230px;
  }
  .arabic {
    font-family: "Traditional Arabic", "Times New Roman", serif;
    font-size: 65px;
    color: #184e77;
    margin: 15px 0;
    direction: rtl;
  }
  .hint {
    color: #526b7a;
    font-size: 17px;
  }
</style>
</head>
<body>
<div class="cards">

<button class="card" onclick="speakArabic('عَالَمٌ')">
  <svg class="earth" viewBox="0 0 240 240"
       xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="globe">
        <circle cx="120" cy="120" r="105"/>
      </clipPath>
    </defs>
    <circle cx="120" cy="120" r="105"
            fill="#42b6ee"/>
    <g clip-path="url(#globe)" fill="#42b978">
      <path d="M35 45 L80 18 108 38 98 64
        65 75 82 95 72 120 50 113
        40 90 18 80 Z"/>
      <path d="M83 125 L115 116 135 140
        120 171 108 214 88 181 80 151 Z"/>
      <path d="M143 29 L190 24 230 65
        211 99 183 96 174 122 154 105
        139 77 117 67 Z"/>
      <path d="M159 127 L193 115 208 148
        190 185 168 171 150 146 Z"/>
      <path d="M193 190 L222 182 239 211
        210 229 187 211 Z"/>
    </g>
    <circle cx="120" cy="120" r="105"
            fill="none" stroke="#197bb2"
            stroke-width="4"/>
  </svg>

  <div class="arabic" lang="ar">عَالَمٌ</div>
  <div class="hint">🔊 Нажмите, чтобы услышать</div>
</button>

<button class="card" onclick="speakArabic('أَرْضٌ')">
  <svg class="earth" viewBox="0 0 240 240" role="img" aria-label="Земля: горы, поле и дерево" xmlns="http://www.w3.org/2000/svg">
    <defs><clipPath id="landscapeCircle"><circle cx="120" cy="120" r="105"/></clipPath></defs>
    <g clip-path="url(#landscapeCircle)">
      <rect width="240" height="240" fill="#bdeaff"/>
      <circle cx="187" cy="57" r="24" fill="#ffe37d"/>
      <path d="M0 136 L55 65 100 131 151 75 240 158 240 240 0 240Z" fill="#8ca6a1"/>
      <path d="M0 151 Q61 100 122 149 Q170 109 240 155 L240 240 0 240Z" fill="#67bb74"/>
      <path d="M0 180 Q110 146 240 178 L240 240 0 240Z" fill="#b27b4c"/>
      <path d="M0 197 Q105 170 240 202 L240 240 0 240Z" fill="#99643f"/>
      <path d="M154 174 L154 118" stroke="#805036" stroke-width="12" stroke-linecap="round"/>
      <circle cx="151" cy="100" r="29" fill="#328d50"/>
      <circle cx="128" cy="113" r="22" fill="#43ac60"/>
      <circle cx="175" cy="113" r="23" fill="#43ac60"/>
      <path d="M61 171 Q66 150 83 149 M65 169 Q54 152 42 157" fill="none" stroke="#267f42" stroke-width="5" stroke-linecap="round"/>
      <path d="M203 189 Q202 177 212 173 M202 187 Q194 176 187 179" fill="none" stroke="#267f42" stroke-width="4" stroke-linecap="round"/>
    </g>
    <circle cx="120" cy="120" r="105" fill="none" stroke="#528f8c" stroke-width="4"/>
  </svg>
  <div class="arabic" lang="ar">أَرْضٌ</div>
  <div class="hint">🔊 Нажмите, чтобы услышать</div>
</button>
</div>

<script>
function speakArabic(word) {
  if (!("speechSynthesis" in window)) {
    alert("Браузер не поддерживает озвучивание.");
    return;
  }

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(word);
  speech.lang = "ar-SA";
  speech.rate = 0.8;

  const voices = window.speechSynthesis.getVoices();
  const arabicVoice = voices.find(
    voice => voice.lang.toLowerCase().startsWith("ar")
  );

  if (arabicVoice) {
    speech.voice = arabicVoice;
  }

  window.speechSynthesis.speak(speech);
}
</script>

</body>
</html>
