
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой арабский словарь</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #eaf5f7;
    font-family: Arial, sans-serif;
  }
  .cards { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 24px; }
  .card {
    width: 310px;
    padding: 30px 20px;
    border: 3px solid #e4c06d;
    border-radius: 25px;
    background: white;
    box-shadow: 0 12px 30px #0002;
    cursor: pointer;
    text-align: center;
  }
  .card:hover {
    transform: scale(1.03);
  }
  .earth {
    width: 230px;
    height: 230px;
  }
  .arabic {
    font-family: "Traditional Arabic", "Times New Roman", serif;
    font-size: 65px;
    color: #184e77;
    margin: 15px 0;
    direction: rtl;
  }
  .hint {
    color: #526b7a;
    font-size: 17px;
  }
</style>
</head>

<div class="cards">

        211 99 183 96 174 122 154 105
        139 77 117 67 Z"/>

        190 185 168 171 150 146 Z"/>

        210 229 187 211 Z"/>

    <circle cx="120" cy="120" r="105"
            fill="none" stroke="#197bb2"
            stroke-width="4"/>
  </svg>

  <div class="arabic" lang="ar">عَالَمٌ</div>
  <div class="hint">🔊 Нажмите, чтобы услышать</div>
</button>

      <path d="M0 180 Q110 146 240 178 L240 240 0 240Z" fill="#b27b4c"/>

<button class="card" onclick="speakArabic('شَمْسٌ')" aria-label="شَمْسٌ — солнце, нажмите для произношения">

        <line x1="197" y1="120" x2="223" y2="120"/>

<button class="card" onclick="speakArabic('قَمَرٌ')" aria-label="قَمَرٌ — луна, нажмите для произношения">
  <svg class="earth" viewBox="0 0 240 240" role="img" aria-label="Полумесяц и звезды в ночном небе" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="moonCircle"><circle cx="120" cy="120" r="105"/></clipPath>
      <mask id="moonCrescent">

        <circle cx="148" cy="87" r="60" fill="black"/>

  <div class="arabic" lang="ar">قَمَرٌ</div>
  <div class="hint">🔊 Нажмите, чтобы услышать</div>
</button>
</div>

<script>
function speakArabic(word) {
  if (!("speechSynthesis" in window)) {
    alert("Браузер не поддерживает озвучивание.");
    return;
  }

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(word);
  speech.lang = "ar-SA";
  speech.rate = 0.8;

  const voices = window.speechSynthesis.getVoices();
  const arabicVoice = voices.find(
    voice => voice.lang.toLowerCase().startsWith("ar")
  );

  if (arabicVoice) {
    speech.voice = arabicVoice;
  }

  window.speechSynthesis.speak(speech);
}
</script>

</body>
</html>
